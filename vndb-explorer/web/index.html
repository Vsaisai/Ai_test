<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12131c">
  <meta name="description" content="Офлайн-каталог визуальных новелл VNDB: полки, теги по категориям, поиск по обязательным и желательным тегам, где скачать или купить.">
  <title>VN Shelf</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- wide screens: name + menu on top; phones: the menu is at the bottom and there is no top bar -->
  <!-- logo (not a link) · search · filters; the menu is at the bottom on phones -->
  <header class="topbar">
    <span class="brand"><img src="icons/icon.svg" alt=""><span>VN Shelf</span></span>
    <form class="topsearch" id="topsearch" role="search">
      <input type="search" id="topq" placeholder="Поиск по названию" autocomplete="off" enterkeyhint="search" aria-label="Поиск по названию">
    </form>
    <button class="filter-btn" id="filterbtn" type="button" aria-label="Фильтры" title="Фильтры">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 5h18l-7 8.5V20l-4-2v-4.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span class="filter-dot" hidden></span>
    </button>
    <nav class="mainnav" id="mainnav"></nav>
  </header>
  <main id="view" tabindex="-1"></main>
  <nav class="bottomnav" id="bottomnav"></nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
