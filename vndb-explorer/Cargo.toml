[package]
name = "vndb-explorer"
version = "0.1.0"
edition = "2021"
description = "VNDB browser: categorized tags, strict/preferred tag search, English titles and where-to-get links"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"

[profile.release]
strip = true
