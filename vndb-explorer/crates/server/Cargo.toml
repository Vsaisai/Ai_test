[package]
name = "vndb-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local web interface (PWA) and REST API for the offline VNDB catalog"

[dependencies]
vndb-core = { path = "../core" }
anyhow = "1"
axum = "0.7"
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
