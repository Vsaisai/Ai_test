[package]
name = "vndb-explorer"
version.workspace = true
edition.workspace = true
description = "VN Shelf in the terminal: tags, strict/preferred tag search, VN pages and where-to-get links from the local catalog"
license.workspace = true

[dependencies]
vndb-core = { path = "../core" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
