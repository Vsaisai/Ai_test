[package]
name = "vndb-explorer"
version.workspace = true
edition.workspace = true
description = "VNDB browser: categorized tags, strict/preferred tag search, English titles and where-to-get links"
license.workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"

