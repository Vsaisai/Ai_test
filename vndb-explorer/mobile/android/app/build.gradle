plugins {
    id 'com.android.application'
}

// Version comes from mobile/VERSION or the git tag in CI (mobile-v1.2.3[.4] -> 1.2.3[.4]), see mobile/build-apk.sh.
// A.B.C.D -> versionCode A*1000000 + B*10000 + C*100 + D, so 0.4.7 -> 40700 and the small fix 0.4.7.1 -> 40701.
def appVersion = System.getenv('VNSHELF_VERSION') ?: '0.3.0'
def parts = appVersion.tokenize('.').collect { it.replaceAll('[^0-9]', '') ?: '0' }.collect { it as int }
if (parts.size() > 4 || parts.drop(1).any { it > 99 }) {
    throw new GradleException("Version $appVersion: use A.B.C or A.B.C.D with B, C and D from 0 to 99")
}
def code = (parts + [0, 0, 0]).take(4).inject(0) { acc, p -> acc * 100 + p }

android {
    namespace 'ru.vnshelf.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.vnshelf.app'
        minSdk 24
        targetSdk 35
        versionCode code
        versionName appVersion
    }

    signingConfigs {
        release {
            // Real releases: provide a keystore through the environment (GitLab CI/CD variables).
            // Otherwise the committed debug keystore is used so that updates install over each other.
            def ks = System.getenv('VNSHELF_KEYSTORE')
            storeFile file(ks ?: 'debug.keystore')
            storePassword System.getenv('VNSHELF_KEYSTORE_PASSWORD') ?: 'android'
            keyAlias System.getenv('VNSHELF_KEY_ALIAS') ?: 'androiddebugkey'
            keyPassword System.getenv('VNSHELF_KEY_PASSWORD') ?: 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Native library built by cargo-ndk (mobile/build-apk.sh)
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true   // compressed .so: ~2x smaller download
        }
    }
}
