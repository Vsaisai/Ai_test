pluginManagement {
    repositories {
        google()
        // Google's mirror of Maven Central (Central often rate-limits shared CI / proxy IPs)
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        // Google's mirror of Maven Central (Central often rate-limits shared CI / proxy IPs)
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
    }
}
rootProject.name = "VNShelf"
include ':app'
