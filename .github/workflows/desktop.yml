name: PC release

# Every push to `beta` builds the PC packages (Windows / Linux / macOS zips with `server` and
# `client` folders). If vndb-explorer/VERSION has no `pc-v<version>` release yet, one is created.
on:
  push:
    branches: [beta]
    paths:
      - 'vndb-explorer/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-latest
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: vndb-explorer
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Tests
        run: cargo test -p vndb-core -p vndb-web

      - name: Build
        run: cargo build --release -p vndb-web -p vndb-explorer

      - name: Package
        run: ./desktop/package.sh ${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: pc-${{ matrix.platform }}
          path: vndb-explorer/target/dist/*.zip

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release (new versions only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d ' \r\n' < vndb-explorer/VERSION)"
          TAG="pc-v$VERSION"
          ls -la dist
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists: bump vndb-explorer/VERSION to publish a new one."
          else
            gh release create "$TAG" dist/*.zip \
              --target "$GITHUB_SHA" \
              --title "VN Shelf $VERSION для ПК" \
              --notes-file vndb-explorer/desktop/RELEASE_NOTES.md
          fi

      # The PC app checks this public repository for new versions (the code repository is
      # private). --latest=false keeps the Android build as the "latest" release there.
      - name: Publish to the public releases repository
        env:
          GH_TOKEN: ${{ secrets.VNDB_SECRET }}
          PUBLIC_REPO: Vsaisai/vnshelf-releases
        run: |
          VERSION="$(tr -d ' \r\n' < vndb-explorer/VERSION)"
          TAG="pc-v$VERSION"
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Secret VNDB_SECRET is not set: the public releases repository is not updated."
            exit 0
          fi
          if gh release view "$TAG" --repo "$PUBLIC_REPO" > /dev/null 2>&1; then
            echo "$PUBLIC_REPO already has $TAG"
            exit 0
          fi
          if gh release create "$TAG" dist/*.zip \
              --repo "$PUBLIC_REPO" \
              --latest=false \
              --title "VN Shelf $VERSION для ПК" \
              --notes-file vndb-explorer/desktop/RELEASE_NOTES.md; then
            echo "Published https://github.com/$PUBLIC_REPO/releases/tag/$TAG"
          else
            echo "::warning::Could not publish $TAG to $PUBLIC_REPO (VNDB_SECRET needs Contents: Read and write there)."
          fi
