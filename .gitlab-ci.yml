stages: [test, build, release]

workflow:
  rules:
    - if: '$CI_COMMIT_TAG == "mobile-v0.4.10"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

default:
  image: rust:1-bookworm
  interruptible: true
  cache:
    key:
      files: [vndb-explorer/Cargo.lock]
      prefix: '$CI_JOB_NAME'
    paths:
      - .cargo/registry/
      - .cargo/git/
  before_script:
    - export CARGO_HOME="$CI_PROJECT_DIR/.cargo"
    - cd vndb-explorer

rust-tests:
  stage: test
  script:
    - curl --fail --silent --show-error --location --retry 3 https://get.nexte.st/0.9.126/linux-musl -o /tmp/nextest.tar.gz
    - tar -xzf /tmp/nextest.tar.gz -C /usr/local/bin cargo-nextest
    - cargo nextest run --locked --profile ci --no-fail-fast -p vndb-core -p vndb-web
    - cargo test --locked --doc -p vndb-core -p vndb-web
  artifacts:
    when: always
    reports:
      junit: vndb-explorer/target/nextest/ci/junit.xml

web-tests:
  stage: test
  image: node:22-bookworm
  cache: []
  script:
    - node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=web-junit.xml "$CI_PROJECT_DIR/ci/web-checks.mjs"
  artifacts:
    when: always
    reports:
      junit: vndb-explorer/web-junit.xml

shell-checks:
  stage: test
  image: debian:bookworm-slim
  cache: []
  script:
    - find desktop mobile "$CI_PROJECT_DIR/ci" -type f \( -name '*.sh' -o -name gradlew \) -print0 | xargs -0 -r -n1 bash -n

linux-package:
  stage: build
  needs:
    - job: rust-tests
      artifacts: false
    - job: web-tests
      artifacts: false
    - job: shell-checks
      artifacts: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^mobile-v/ || $CI_COMMIT_BRANCH == "release/mobile-0.4.10"'
      when: never
    - exists: [vndb-explorer/desktop/package.sh]
  script:
    - apt-get update && apt-get install -y --no-install-recommends zip unzip python3 curl
    - cargo build --locked --release -p vndb-web -p vndb-explorer
    - bash desktop/package.sh linux-x64
    - bash "$CI_PROJECT_DIR/ci/smoke-linux.sh" target/dist/*-linux-x64.zip
  artifacts:
    name: 'VN-Shelf-linux-$CI_COMMIT_SHORT_SHA'
    paths: [vndb-explorer/target/dist/*.zip]
    expire_in: 30 days

android-apk:
  stage: build
  needs:
    - job: rust-tests
      artifacts: false
  timeout: 1h
  rules:
    - if: '$CI_COMMIT_TAG =~ /^pc-v/'
      when: never
    - exists: [vndb-explorer/mobile/build-apk.sh]
  variables:
    ANDROID_HOME: '$CI_PROJECT_DIR/.android-sdk'
    ANDROID_NDK_HOME: '$CI_PROJECT_DIR/.android-sdk/ndk/27.2.12479018'
    GRADLE_USER_HOME: '$CI_PROJECT_DIR/.gradle'
  script:
    - bash "$CI_PROJECT_DIR/ci/android.sh"
    - bash "$CI_PROJECT_DIR/ci/verify-apk.sh" target/apk/*.apk
  artifacts:
    name: 'VN-Shelf-android-$CI_COMMIT_SHORT_SHA'
    paths: [vndb-explorer/target/apk/*.apk]
    expire_in: 30 days

windows-package:
  stage: build
  image: null
  tags: [saas-windows-medium-amd64]
  before_script: []
  cache: []
  rules:
    - if: '$CI_COMMIT_TAG =~ /^mobile-v/ || $CI_COMMIT_BRANCH == "release/mobile-0.4.10"'
      when: never
    - exists: [vndb-explorer/desktop/package.sh]
  script:
    - |
      $ErrorActionPreference = 'Stop'
      $env:Path = "${env:USERPROFILE}\.cargo\bin;$env:Path"
      if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
        $installer = Join-Path $env:TEMP 'rustup-init.exe'
        Invoke-WebRequest -Uri 'https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe' -OutFile $installer
        & $installer -y --profile minimal --default-host x86_64-pc-windows-msvc --default-toolchain stable --no-modify-path
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      }
    - rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - Set-Location vndb-explorer
    - cargo +stable-x86_64-pc-windows-msvc test --locked -p vndb-core -p vndb-web
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - cargo +stable-x86_64-pc-windows-msvc build --locked --release -p vndb-web -p vndb-explorer
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - '& "$env:CI_PROJECT_DIR/ci/package-windows.ps1"'
  artifacts:
    paths: [vndb-explorer/target/dist/*.zip]
    expire_in: 30 days


release-pc:
  stage: release
  image: python:3.12-bookworm
  cache: []
  before_script: []
  interruptible: false
  resource_group: 'release-$CI_COMMIT_TAG'
  rules:
    - if: '$CI_COMMIT_TAG =~ /^pc-v[0-9]+([.][0-9]+){2,3}$/'
  needs: [windows-package, linux-package]
  script:
    - python3 ci/publish.py

release-mobile:
  extends: release-pc
  rules:
    - if: '$CI_COMMIT_BRANCH == "release/mobile-0.4.10" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_TAG =~ /^mobile-v[0-9]+([.][0-9]+){2,3}$/'
  needs: [android-apk, rust-tests, web-tests, shell-checks]

macos-package:
  stage: build
  image: macos-26-xcode-26
  tags: [saas-macos-medium-m1]
  cache: []
  before_script: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "beta" && $VNSHELF_MACOS_RUNNER == "enabled"'
      when: manual
      allow_failure: true
  script:
    - cd vndb-explorer
    - if ! command -v rustup >/dev/null; then curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal; fi
    - export PATH="$HOME/.cargo/bin:$PATH"
    - rustup toolchain install stable --profile minimal
    - cargo +stable build --locked --release -p vndb-web -p vndb-explorer
    - bash desktop/package.sh macos-arm64
  artifacts:
    paths: [vndb-explorer/target/dist/*-macos-arm64.zip]
    expire_in: 30 days

include:
  - local: ci/restore-releases.yml
